plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}


group = 'bruhof'
version = '0.0.1-alpha'

base {
    archivesName = 'teenycraft'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

mixin {
    add sourceSets.main, "teenycraft.refmap.json"
    config "teenycraft.mixins.json"
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'


            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', 'teenycraft'
            property 'mixin.config', 'teenycraft.mixins.json'
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'teenycraft'
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'teenycraft'
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

def generatedAbilityIconResources = layout.buildDirectory.dir('generated/ability-icon-resources')
sourceSets.main.resources.srcDir generatedAbilityIconResources

tasks.register('generateAbilityIconModels') {
    group = 'teeny craft'
    description = 'Generates categorized ability item models from ability JSON indexes and approved icon textures.'

    def abilityData = fileTree('src/main/resources/data/teenycraft/abilities') {
        include '**/*.json'
    }
    def figureData = fileTree('src/main/resources/data/teenycraft/figures') {
        include '*.json'
    }
    def iconTextures = fileTree('src/main/resources/assets/teenycraft/textures/item') {
        include 'ability_*.png'
    }
    def displayCategoryFile = file('src/main/resources/assets/teenycraft/ability_display_categories.json')
    def displayProfileModels = fileTree('src/main/resources/assets/teenycraft/models/item/ability_display') {
        include '*.json'
    }

    inputs.files abilityData, figureData, iconTextures, displayCategoryFile, displayProfileModels
    outputs.dir generatedAbilityIconResources

    doLast {
        def jsonSlurper = new groovy.json.JsonSlurper()
        def abilitiesById = [:]

        abilityData.files.sort().each { abilityFile ->
            def ability = jsonSlurper.parse(abilityFile)
            def id = ability.id as String
            if (!id) {
                throw new GradleException("Ability file ${abilityFile} has no id")
            }
            if (abilitiesById.put(id, ability) != null) {
                throw new GradleException("Duplicate ability id '${id}'")
            }
        }

        // Only figure-equipped definitions require unique icon indexes. Internal
        // effect/support records may share an index because they are never rendered.
        def equippedIds = [] as Set
        def iconVariantAssignments = [:]
        figureData.files.sort().each { figureFile ->
            def figure = jsonSlurper.parse(figureFile)
            def figureId = figure.id as String
            def figureAbilities = (figure.abilities ?: []).collect { it as String }
            figureAbilities.each { equippedIds.add(it) }

            if (figure.containsKey('ability_icon_variants')) {
                if (!(figure.ability_icon_variants instanceof Map)) {
                    throw new GradleException("Figure '${figureId}' ability_icon_variants must be a JSON object")
                }

                figure.ability_icon_variants.each { rawAbilityId, rawVariant ->
                    def abilityId = rawAbilityId as String
                    if (!figureAbilities.contains(abilityId)) {
                        throw new GradleException("Figure '${figureId}' assigns an icon variant to unequipped ability '${abilityId}'")
                    }
                    if (!(rawVariant instanceof String) || !(rawVariant ==~ /[a-z0-9_]+/)) {
                        throw new GradleException("Figure '${figureId}' ability '${abilityId}' has invalid icon variant '${rawVariant}'")
                    }

                    def modelId = "${abilityId}__variant_${rawVariant}".toString()
                    iconVariantAssignments.computeIfAbsent(modelId) { [] }.add(figureId)
                }
            }
        }

        def equippedIndexes = [:]
        equippedIds.sort().each { id ->
            def ability = abilitiesById[id]
            if (ability == null) {
                throw new GradleException("Figure data references missing ability '${id}'")
            }
            if (ability.texture_index == null) {
                throw new GradleException("Equipped ability '${id}' has no texture_index")
            }
            int index = ability.texture_index as int
            def previous = equippedIndexes.put(index, id)
            if (previous != null) {
                throw new GradleException("Equipped abilities '${previous}' and '${id}' share texture_index ${index}")
            }
        }

        def displayCategories = ['tool', 'action', 'fist', 'throwable', 'aimed']
        def allowedDisplayCategories = displayCategories as Set
        if (!displayCategoryFile.exists()) {
            throw new GradleException("Missing ability display category manifest: ${displayCategoryFile}")
        }

        def displayConfig = jsonSlurper.parse(displayCategoryFile)
        if (!(displayConfig instanceof Map)) {
            throw new GradleException('Ability display category manifest must contain a JSON object')
        }

        def allowedDisplayKeys = (allowedDisplayCategories + ['state_overrides']) as Set
        def unexpectedDisplayKeys = displayConfig.keySet().findAll { !allowedDisplayKeys.contains(it) }
        if (!unexpectedDisplayKeys.isEmpty()) {
            throw new GradleException("Unknown ability display manifest keys: ${unexpectedDisplayKeys.sort().join(', ')}")
        }

        def displayCategoryByAbility = [:]
        displayCategories.each { category ->
            def profileFile = file("src/main/resources/assets/teenycraft/models/item/ability_display/${category}.json")
            if (!profileFile.exists()) {
                throw new GradleException("Missing item display profile model for category '${category}': ${profileFile}")
            }

            if (!displayConfig.containsKey(category) || !(displayConfig[category] instanceof List)) {
                throw new GradleException("Ability display category '${category}' must be a JSON array")
            }

            displayConfig[category].eachWithIndex { rawId, index ->
                if (!(rawId instanceof String) || rawId.isBlank() || rawId != rawId.trim()) {
                    throw new GradleException("Invalid ability id at display category '${category}' index ${index}")
                }

                def previousCategory = displayCategoryByAbility.put(rawId, category)
                if (previousCategory != null) {
                    throw new GradleException("Ability '${rawId}' appears in both '${previousCategory}' and '${category}' display categories")
                }
            }
        }

        displayCategoryByAbility.each { id, category ->
            if (!abilitiesById.containsKey(id)) {
                throw new GradleException("Ability display category '${category}' references missing ability '${id}'")
            }
            if (!equippedIds.contains(id)) {
                throw new GradleException("Ability display category '${category}' references non-renderable ability '${id}'")
            }
        }

        def rawStateOverrides = displayConfig.containsKey('state_overrides') ? displayConfig.state_overrides : [:]
        if (!(rawStateOverrides instanceof Map)) {
            throw new GradleException("Ability display manifest 'state_overrides' must be a JSON object")
        }

        def stateCategoryOverrides = [:]
        rawStateOverrides.each { rawStateId, rawCategory ->
            if (!(rawStateId instanceof String) || rawStateId.isBlank() || rawStateId != rawStateId.trim()) {
                throw new GradleException("Ability display state override contains an invalid state id")
            }
            if (!(rawCategory instanceof String) || !allowedDisplayCategories.contains(rawCategory)) {
                throw new GradleException("Ability display state '${rawStateId}' uses unknown category '${rawCategory}'")
            }
            stateCategoryOverrides[rawStateId] = rawCategory
        }

        def texturePrefix = 'ability_'
        def textureSuffix = '.png'
        def variantMarker = '__variant_'
        def customIconIds = []
        def variantIcons = []
        iconTextures.files.sort().each { textureFile ->
            if (textureFile.name.endsWith('_golden.png') || textureFile.name == 'ability_bat_mine_button.png') {
                return
            }

            def modelId = textureFile.name.substring(texturePrefix.length(), textureFile.name.length() - textureSuffix.length())
            int markerIndex = modelId.indexOf(variantMarker)
            if (markerIndex < 0) {
                customIconIds.add(modelId)
                return
            }

            def abilityId = modelId.substring(0, markerIndex)
            def variant = modelId.substring(markerIndex + variantMarker.length())
            if (!abilityId || !(variant ==~ /[a-z0-9_]+/) || modelId.indexOf(variantMarker, markerIndex + variantMarker.length()) >= 0) {
                throw new GradleException("Invalid ability icon variant filename: '${textureFile.name}'")
            }
            variantIcons.add([abilityId: abilityId, variant: variant, modelId: modelId])
        }
        customIconIds.sort()

        variantIcons.groupBy { it.abilityId }.each { abilityId, icons ->
            icons.sort { it.variant }.eachWithIndex { icon, index -> icon.variantIndex = index + 1 }
        }

        customIconIds.each { id ->
            if (!abilitiesById.containsKey(id)) {
                throw new GradleException("Custom ability texture has no matching ability id: '${id}'")
            }
            if (!equippedIds.contains(id)) {
                throw new GradleException("Custom ability texture '${id}' is not used by any figure")
            }
            if (!displayCategoryByAbility.containsKey(id)) {
                throw new GradleException("Custom ability texture '${id}' has no entry in ability_display_categories.json")
            }
        }

        variantIcons.each { icon ->
            if (!abilitiesById.containsKey(icon.abilityId)) {
                throw new GradleException("Ability icon variant '${icon.modelId}' has no matching ability id '${icon.abilityId}'")
            }
            if (!equippedIds.contains(icon.abilityId)) {
                throw new GradleException("Ability icon variant '${icon.modelId}' belongs to an ability not used by any figure")
            }
            if (!customIconIds.contains(icon.abilityId)) {
                throw new GradleException("Ability icon variant '${icon.modelId}' has no base custom icon")
            }
            if (!displayCategoryByAbility.containsKey(icon.abilityId)) {
                throw new GradleException("Ability icon variant '${icon.modelId}' has no base entry in ability_display_categories.json")
            }
            if (!iconVariantAssignments.containsKey(icon.modelId)) {
                throw new GradleException("Ability icon variant '${icon.modelId}' is not assigned by any figure")
            }
        }

        def variantModelIds = variantIcons.collect { it.modelId } as Set
        iconVariantAssignments.each { modelId, figureIds ->
            if (!variantModelIds.contains(modelId)) {
                throw new GradleException("Figures ${figureIds.sort().join(', ')} assign missing ability icon variant '${modelId}'")
            }
        }

        def outputRoot = generatedAbilityIconResources.get().asFile
        project.delete(outputRoot)
        def modelDirectory = new File(outputRoot, 'assets/teenycraft/models/item')
        modelDirectory.mkdirs()

        def writeJson = { File target, Object value ->
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(value)) + System.lineSeparator()
        }

        customIconIds.each { id ->
            writeJson(new File(modelDirectory, "ability_${id}.json"), [
                    parent  : "teenycraft:item/ability_display/${displayCategoryByAbility[id]}",
                    textures: [layer0: "teenycraft:item/ability_${id}"]
            ])
        }

        variantIcons.each { icon ->
            writeJson(new File(modelDirectory, "ability_${icon.modelId}.json"), [
                    parent  : "teenycraft:item/ability_display/${displayCategoryByAbility[icon.abilityId]}",
                    textures: [layer0: "teenycraft:item/ability_${icon.modelId}"]
            ])
        }

        def batMineButton = file('src/main/resources/assets/teenycraft/textures/item/ability_bat_mine_button.png')
        boolean hasBatMineButton = batMineButton.exists() && customIconIds.contains('bat_mine')
        def supportedDisplayStates = hasBatMineButton ? ['bat_mine_button': 'bat_mine'] : [:]
        stateCategoryOverrides.keySet().each { stateId ->
            if (!supportedDisplayStates.containsKey(stateId)) {
                throw new GradleException("Ability display state override '${stateId}' has no supported generated state model")
            }
        }

        if (hasBatMineButton) {
            def buttonCategory = stateCategoryOverrides.getOrDefault('bat_mine_button', displayCategoryByAbility.bat_mine)
            writeJson(new File(modelDirectory, 'ability_bat_mine_button.json'), [
                    parent  : "teenycraft:item/ability_display/${buttonCategory}",
                    textures: [layer0: 'teenycraft:item/ability_bat_mine_button']
            ])
        }

        def variantsByAbility = variantIcons.groupBy { it.abilityId }
        def overrides = []
        customIconIds.sort { left, right ->
            (abilitiesById[left].texture_index as int) <=> (abilitiesById[right].texture_index as int)
        }.each { id ->
            overrides.add([
                    predicate: ['teenycraft:ability_id': abilitiesById[id].texture_index as int],
                    model    : "teenycraft:item/ability_${id}"
            ])

            (variantsByAbility[id] ?: []).sort { it.variantIndex }.each { icon ->
                overrides.add([
                        predicate: [
                                'teenycraft:ability_id': abilitiesById[id].texture_index as int,
                                'teenycraft:icon_variant': icon.variantIndex as int
                        ],
                        model    : "teenycraft:item/ability_${icon.modelId}"
                ])
            }

            if (id == 'bat_mine' && hasBatMineButton) {
                overrides.add([
                        predicate: [
                                'teenycraft:ability_id': abilitiesById.bat_mine.texture_index as int,
                                'teenycraft:is_button' : 1
                        ],
                        model    : 'teenycraft:item/ability_bat_mine_button'
                ])
            }
        }

        def wrapper = [
                parent   : 'minecraft:item/generated',
                textures : [layer0: 'teenycraft:item/ability_default'],
                overrides: overrides
        ]
        (1..3).each { slot ->
            writeJson(new File(modelDirectory, "ability_${slot}.json"), wrapper)
        }
    }
}

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('generateAbilityIconModels')

    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs": "teenycraft.mixins.json"])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
